<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llaveros BioSat</title>
<meta name="description" content="Pide tu llavero impreso en 3D y ayuda a financiar el CanSat BioSat 2027.">
<meta name="theme-color" content="#0c1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%23FFD21F'/%3E%3Ccircle cx='32' cy='12' r='8' fill='none' stroke='%23161616' stroke-width='5'/%3E%3C/svg%3E">
<!--
  Pagina que envuelve la tienda de Apps Script. Abierta directamente,
  script.google.com muestra el aviso "aplicacion creada por un usuario";
  metida en esta pagina no sale. La tienda sigue viviendo en Apps Script
  (doGet la permite en iframe con XFrameOptionsMode.ALLOWALL).
  Si cambia la implementacion, solo hay que cambiar el src del iframe.

  La tienda esta SIEMPRE visible y el aviso de carga va encima, sin
  bloquear el dedo. Antes la tienda se ocultaba hasta su evento "load" y
  en algunos moviles ese evento no llegaba hasta tocar la pantalla: se
  quedaba "pensando". Ahora el aviso se quita al cargar, al tocar o, como
  mucho, a los 6 segundos.
-->
<style>
  html,body{margin:0;height:100%;background:#0c1220;color:#f0ece1}
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh;background:#0c1220}
  .carga{position:fixed;inset:0;z-index:2;pointer-events:none;
    display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;text-align:center;padding:0 24px;
    background:#0c1220;transition:opacity .35s;
    font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#8f9bb1}
  .carga.fuera{opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
  .carga strong{color:#f0ece1;font-size:19px}
  .rueda{width:34px;height:34px;border:3px solid #26314a;border-top-color:#7dd35b;
    border-radius:50%;animation:gira .9s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="carga" id="carga">
  <div class="rueda" aria-hidden="true"></div>
  <strong>Tienda BioSat</strong>
  <span>Abriendo la tienda&hellip;</span>
</div>
<iframe id="tienda" title="Tienda de llaveros BioSat"
        src="https://script.google.com/macros/s/AKfycbys719HxBb96siSxQhXSo_q3oQ2XWbq5ZpfTMdtaMDmdempxYQUtbcrvl3OamG20Y__/exec"
        allow="clipboard-write"></iframe>
<script>
  var carga = document.getElementById('carga');
  function quitar(){ carga.className = 'carga fuera'; }
  document.getElementById('tienda').addEventListener('load', function(){ setTimeout(quitar, 300); });
  window.addEventListener('blur', quitar);          // el dedo ya esta dentro de la tienda
  document.addEventListener('pointerdown', quitar);
  setTimeout(quitar, 6000);
</script>
</body>
</html>
