<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Diagnostico tienda</title>
<!-- Pagina de prueba: la misma tienda, con un registro de lo que pasa
     encima. Sirve para ver en un movil real por que se queda "pensando". -->
<style>
  html,body{margin:0;height:100%;background:#0c1220}
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh;background:#0c1220}
  #reg{position:fixed;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
    max-height:45vh;overflow:hidden;background:rgba(255,240,0,.93);color:#000;
    font:12px/1.35 monospace;padding:6px 8px;white-space:pre-wrap}
</style>
</head>
<body>
<iframe id="tienda" title="Tienda"
        src="https://script.google.com/macros/s/AKfycbys719HxBb96siSxQhXSo_q3oQ2XWbq5ZpfTMdtaMDmdempxYQUtbcrvl3OamG20Y__/exec"></iframe>
<div id="reg"></div>
<script>
  var t0 = Date.now(), reg = document.getElementById('reg'), lineas = [];
  function log(s){
    lineas.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + s);
    if (lineas.length > 14) lineas.splice(1, 1);
    reg.textContent = lineas.join('\n');
  }
  log('DIAGNOSTICO v1 · ' + navigator.userAgent.slice(0, 120));
  log('visible=' + document.visibilityState + ' foco=' + document.hasFocus());
  document.getElementById('tienda').addEventListener('load', function(){ log('marco: load'); });
  document.addEventListener('visibilitychange', function(){ log('visible=' + document.visibilityState); });
  window.addEventListener('blur', function(){ log('blur (foco dentro de la tienda)'); });
  window.addEventListener('focus', function(){ log('focus'); });
  document.addEventListener('pointerdown', function(){ log('toque'); });
  var n = 0, ultimo = Date.now();
  setInterval(function(){
    n++; var ahora = Date.now();
    if (ahora - ultimo > 2500) log('reloj PARADO ' + ((ahora - ultimo) / 1000).toFixed(1) + 's');
    ultimo = ahora;
    if (n % 3 === 0) log('reloj ok (' + n + ')');
  }, 1000);
  var raf = 0; (function f(){ raf++; requestAnimationFrame(f); })();
  setTimeout(function(){ log('pintados a los 5s: ' + raf); }, 5000);
</script>
</body>
</html>
